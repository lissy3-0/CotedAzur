<style>
  :root {
    --pink: #ec4899;
    --pink-dark: #db2777;
    --pink-soft: #fce7f3;
    --lavender: #a78bfa;
    --lavender-soft: #ede9fe;
    --mint: #34d399;
    --mint-soft: #d1fae5;
    --gold: #f59e0b;
    --gold-soft: #fef3c7;
    --coral: #fb7185;
    --coral-soft: #ffe4e6;
    --text: #4a2545;
    --muted: #9d7b95;
    --border: #f3d9ec;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #fff0f6 0%, #f8ecff 45%, #eef4ff 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 50px;
  }
  header {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(120deg, var(--pink) 0%, var(--lavender) 100%);
    color: white;
    padding: 12px 14px 0;
    box-shadow: 0 3px 10px rgba(180, 60, 140, 0.25);
  }
  .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .brand-row h1 {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 24px;
    margin: 0;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
  }
  .backup-btns { display: flex; gap: 6px; }
  .backup-btns button {
    background: rgba(255,255,255,0.25); border: none; color: white;
    border-radius: 10px; padding: 7px 10px; font-size: 16px;
  }
  .main-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .main-tabs::-webkit-scrollbar { display: none; }
  .main-tab-btn {
    flex: 0 0 auto; border: none; background: rgba(255,255,255,0.18); color: white;
    padding: 9px 14px; border-radius: 14px 14px 0 0; font-weight: 700; font-size: 13.5px;
    white-space: nowrap; opacity: 0.85;
  }
  .main-tab-btn.active { background: #fff8fb; color: var(--pink-dark); opacity: 1; }

  .sub-tabs {
    position: sticky; top: 84px; z-index: 25;
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px;
    background: #fff8fb; border-bottom: 1px solid var(--border);
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .sub-tabs::-webkit-scrollbar { display: none; }
  .sub-tab-btn {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: #fdf2f8; color: var(--text); font-size: 12.5px; font-weight: 700;
    white-space: nowrap; display: flex; align-items: center; gap: 5px;
  }
  .sub-tab-btn.active { background: var(--pink); border-color: var(--pink); color: white; }
  .sub-tab-btn .badge { background: rgba(0,0,0,0.08); border-radius: 999px; padding: 1px 6px; font-size: 10.5px; font-weight: 700; }
  .sub-tab-btn.active .badge { background: rgba(255,255,255,0.3); }
  .sub-tab-btn.all-done .badge { background: var(--mint); color: white; }

  main#content { padding: 12px 12px 10px; max-width: 700px; margin: 0 auto; }

  h2.section-title { font-size: 17px; margin: 4px 2px 10px; color: var(--pink-dark); }
  .hint { color: var(--muted); font-size: 12.5px; text-align: center; padding: 16px 0; }

  /* progress */
  .progress-wrap { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 0 2px 12px; color: var(--pink-dark); font-weight: 700; }
  .progress-bar-bg { flex: 1; height: 9px; background: var(--pink-soft); border-radius: 999px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--lavender)); border-radius: 999px; transition: width .25s; }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 12px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(200,120,170,0.08);
  }
  .card-fehlt { background: var(--coral-soft); border-color: #fda4af; }
  .card-vorhanden { background: var(--gold-soft); border-color: #fcd34d; }
  .card-gepackt { background: var(--mint-soft); border-color: #6ee7b7; }
  .card-lissy { background: #fce7f3; border-color: #f9a8d4; }
  .card-marc { background: #dbeafe; border-color: #93c5fd; }
  .card-sonstiges { background: #f1f5f9; border-color: #cbd5e1; }
  .card-einkaufen { background: #cffafe; border-color: #67e8f9; }
  .card-done { background: var(--mint-soft); border-color: #a7f3d0; opacity: 0.85; }
  .card-done .item-text { text-decoration: line-through; color: var(--muted); }
  .item-row { display: flex; align-items: center; gap: 8px; }
  .done-checkbox { width: 23px; height: 23px; flex: 0 0 auto; accent-color: var(--mint); }
  .item-main { flex: 1; min-width: 0; }
  .item-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

<script>
(function () {
"use strict";

/* ============================= HELPERS ============================= */

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 9) + "-" + Date.now().toString(36).slice(-5);
}
function escapeHtml(str) {
  str = (str === null || str === undefined) ? "" : String(str);
  return str.replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function minutesToHHMM(mins) {
  mins = ((mins % 1440) + 1440) % 1440;
  return pad2(Math.floor(mins / 60)) + ":" + pad2(mins % 60);
}
function hhmmToMinutes(str) {
  if (!str) return null;
  var parts = str.split(":");
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}
function addDaysIso(iso, n) {
  var d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function formatDayLabel(iso) {
  var d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
}
function compressImageFile(file, maxDim, quality) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function () {
      var img = new Image();
      img.onerror = reject;
      img.onload = function () {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality || 0.62));
        } catch (e) { reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================= DEFAULT DATA ============================= */

  "Kleidung (Lissy)": ["Kleider","Kurze Hosen","Lange Hosen","Bikinis","Oberteile","Sportkleidung","Unterhosen","BHs","Socken","Schlafanzug","Röcke","Pullis","Jäckchen","Hohe Schuhe","Tiefe Schuhe","Sneaker","Tücher Strand","Strandkleid","Kappe","Regenjacke","Jogginghose","Schickes Kleid (Babyboo, Clubl)","Tuch Kopf"],
  "Koffer (Lissy)": ["Heatless Curls","Satinhaube","Dyson + Aufsätze","Glätteisen","Waschlappen","Kleines Gesichtshandtuch","Handtasche klein"],
  "Handgepäck": ["Sonnenbrille","Portmonee","Goodie Bag","Ladekabel Handy","Ladekabel Apple Watch","Apple Watch","Ladekabel Mac / iPad","MacBook / iPad","Kamera","Handy","Stift","Block","Handyhülle wasserdicht x2","Handyschnur","Desinfektion","Ladekabel Marc","Desinfektionstücher","Powerbank","Brille","Regenschirm","Taschenlampe","Buch","Kameraladegerät","Speicherkarte"]
};
var PACK_CATEGORIES = Object.keys(DEFAULT_PACKLISTE);

// unified single-select tag per packliste item: pick ONE of these 5 (or none)
var PACK_TAGS = [
  { key: "gepackt", label: "Gepackt", emoji: "🎒", cls: "st-gepackt" },
  { key: "vorhanden", label: "Vorhanden", emoji: "🏠", cls: "st-vorhanden" },
  { key: "lissy", label: "Lissy", emoji: "👧", cls: "st-lissy" },

var PACK_TAG_ORDER = ["gepackt", "vorhanden", "lissy", "marc", "sonstiges"];
function packTagInfo(key) {
  for (var i = 0; i < PACK_TAGS.length; i++) if (PACK_TAGS[i].key === key) return PACK_TAGS[i];
  return null;
}

var U_STATUSES = [

];
function uStatusInfo(key) {
  for (var i = 0; i < U_STATUSES.length; i++) if (U_STATUSES[i].key === key) return U_STATUSES[i];
  return U_STATUSES[0];
}

function freshPackliste() {
  var out = {};
  PACK_CATEGORIES.forEach(function (cat) {
    out[cat] = DEFAULT_PACKLISTE[cat].map(function (text) {
      return { id: uid("p"), text: text, note: "", tag: null, done: false, wantToBuy: false };
    });
  });
  return out;
}

function freshState() {
  return {
    ui: { mainTab: "packliste", packlisteCat: PACK_CATEGORIES[0], uView: "liste", eView: "gerichte" },
    packliste: freshPackliste(),
    reise: { start: new Date().toISOString().slice(0, 10), days: 7, dayStart: "08:00", dayEnd: "23:00" },

    essen: { dishes: [], entries: [] },
    einkauf: { bought: {}, custom: [] }
  };
}

/* ============================= STATE ============================= */

var STORAGE_KEY = "cotedazur-app-v1";
var state = loadState();

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      var fresh = freshState();
      // fill in any missing top-level keys (forward-compatible)
      Object.keys(fresh).forEach(function (k) { if (!(k in parsed)) parsed[k] = fresh[k]; });
      PACK_CATEGORIES.forEach(function (cat) {
        if (!parsed.packliste[cat]) {
          parsed.packliste[cat] = DEFAULT_PACKLISTE[cat].map(function (text) {
            return { id: uid("p"), text: text, note: "", tag: null, done: false, wantToBuy: false };
          });
        }
      });
      // migrate older data models to the current single "tag" field per item
      for (var cat2 in parsed.packliste) {
        parsed.packliste[cat2].forEach(function (item) {
          if (typeof item.tag === "undefined") {
            // v2 had separate status ("fehlt"/"vorhanden"/"gepackt"/"imauto") + owner fields.
            // Only a deliberately-chosen status becomes the new tag; the auto-assigned owner does not.
            if (item.status === "imauto") { item.tag = "gepackt"; item.done = true; }
            else if (item.status === "vorhanden" || item.status === "gepackt") { item.tag = item.status; }
            else { item.tag = null; }
            delete item.status;
            delete item.owner;
          }
          if (typeof item.done !== "boolean") item.done = false;
          if (typeof item.wantToBuy !== "boolean") item.wantToBuy = false;
        });
      }
      return parsed;
    }
  } catch (e) { /* fall through */ }
  return freshState();
}

var saveWarned = false;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    if (!saveWarned) {
      saveWarned = true;
      alert("⚠️ Der Speicherplatz des Browsers ist voll (meist wegen vieler Fotos). Diese Änderung wurde nicht dauerhaft gespeichert. Tipp: über 💾 ein Backup sichern und ein paar Fotos verkleinern/entfernen, dann klappt's wieder.");

}

function renderApp() {
  renderMainTabs();
  if (state.ui.mainTab === "packliste") renderPackliste();
  else if (state.ui.mainTab === "unternehmungen") renderUnternehmungen();

}

/* ============================= PACKLISTE ============================= */

function packCounts(cat) {

}

function packItemCardHtml(item) {
  var cardCls = item.done ? "card-done" : (item.wantToBuy ? "card-einkaufen" : (item.tag ? "card-" + item.tag : ""));
  var buyChip = '<button class="status-chip' + (item.wantToBuy ? " active st-einkaufen" : "") + '" data-action="pack-toggle-buy" data-id="' + item.id + '">🛒 Einkaufen</button>';
  var tagChips = PACK_TAGS.map(function (s) {
    var active = s.key === item.tag;
    return '<button class="status-chip' + (active ? " active " + s.cls : "") + '" data-action="pack-set-tag" data-id="' + item.id + '" data-tag="' + s.key + '">' + s.emoji + " " + s.label + "</button>";
  }).join("");
  return '<div class="card ' + cardCls + '">' +
    '<div class="item-row">' +
    '<input type="checkbox" class="done-checkbox" data-action="pack-toggle-done" data-id="' + item.id + '"' + (item.done ? " checked" : "") + '>' +
    '<div class="item-main">' +
    '<div class="item-title-line"><span class="item-text" data-action="pack-edit-text" data-id="' + item.id + '">' + escapeHtml(item.text) + "</span></div>" +
    (item.note ? '<div class="item-note">📝 ' + escapeHtml(item.note) + "</div>" : "") +
    "</div>" +
    '<div class="item-actions">' +
    '<button class="icon-btn' + (item.note ? " has-note" : "") + '" data-action="pack-edit-note" data-id="' + item.id + '" title="Notiz">📝</button>' +
    '<button class="icon-btn" data-action="pack-delete" data-id="' + item.id + '" title="Löschen">🗑️</button>' +
    "</div></div>" +
    '<div class="status-chip-row">' + buyChip + tagChips + "</div>" +
    "</div>";
}

function renderPackliste() {
  subTabsEl.innerHTML = PACK_CATEGORIES.map(function (cat) {
    var c = packCounts(cat);
    var remaining = c.total - c.done;
    var allDone = c.total > 0 && remaining === 0;
    return '<button class="sub-tab-btn' + (state.ui.packlisteCat === cat ? " active" : "") + (allDone ? " all-done" : "") +
      '" data-action="pack-cat" data-cat="' + escapeHtml(cat) + '">' + escapeHtml(cat) +
      ' <span class="badge">' + (allDone ? "✓" : remaining) + "</span></button>";
  }).join("");

  var cat = state.ui.packlisteCat;
  var allItems = state.packliste[cat];
  var openItemsRaw = allItems.filter(function (i) { return !i.done; });
  var doneItems = allItems.filter(function (i) { return i.done; });

  // "Einkaufen"-marked items form their own contiguous block up front, like a tag of their own
  var buyItems = openItemsRaw.filter(function (i) { return i.wantToBuy; });
  var restItems = openItemsRaw.filter(function (i) { return !i.wantToBuy; });

  // group the rest: untagged first (in original order), then one contiguous block per tag (fixed order)
  var untagged = restItems.filter(function (i) { return !i.tag; });
  var groupedRest = untagged.slice();
  PACK_TAG_ORDER.forEach(function (tagKey) {
    groupedRest = groupedRest.concat(restItems.filter(function (i) { return i.tag === tagKey; }));
  });
  var openItems = buyItems.concat(groupedRest);

  var overallDone = 0, overallTotal = 0;
  PACK_CATEGORIES.forEach(function (c2) { var cc = packCounts(c2); overallDone += cc.done; overallTotal += cc.total; });
  var pct = overallTotal ? Math.round((overallDone / overallTotal) * 100) : 0;

  var html = '<div class="progress-wrap"><span>' + overallDone + " / " + overallTotal + ' im Auto (gesamt)</span></div>' +
    '<div class="progress-bar-bg" style="margin:-6px 2px 14px"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="cat-header"><h2 class="section-title" style="margin:0">' + escapeHtml(cat) + '</h2>' +
    '<button class="reset-cat-btn" data-action="pack-reset-cat" data-cat="' + escapeHtml(cat) + '">Reiter zurücksetzen</button></div>';

  if (allItems.length === 0) {
    html += '<div class="hint">Noch keine Punkte in diesem Reiter. Füge unten welche hinzu. 🌸</div>';
  } else {
    if (openItems.length === 0) {
      html += '<div class="hint">Alles aus diesem Reiter ist schon im Auto! 🚗🎉</div>';
    } else {
      if (buyItems.length) {
        html += '<h2 class="section-title" style="font-size:12.5px;color:#0e7490;margin:2px 2px 8px">🛒 Zum Einkaufen (' + buyItems.length + ")</h2>";
        html += "<div>" + buyItems.map(packItemCardHtml).join("") + "</div>";
      }
      if (groupedRest.length) {
        html += "<div>" + groupedRest.map(packItemCardHtml).join("") + "</div>";
      }
    }
    if (doneItems.length) {
      html += '<h2 class="section-title" style="font-size:14px;color:var(--muted);margin-top:16px">✅ Erledigte Sachen (' + doneItems.length + ")</h2>";
      html += "<div>" + doneItems.map(packItemCardHtml).join("") + "</div>";
    }
  }

  html += '<form class="add-form" data-action="pack-add" data-cat="' + escapeHtml(cat) + '">' +
    '<input type="text" name="text" placeholder="Neuer Punkt…" autocomplete="off">' +
    '<button type="submit">+</button></form>';

  contentEl.innerHTML = html;
}

function packFindItem(id) {
  for (var cat in state.packliste) {
    var arr = state.packliste[cat];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  }
  return null;
}

function planSummaryHtml(item) {
  if (item.day === null || item.day === undefined || item.day === "" || !item.startTime) return "";
  var start = hhmmToMinutes(item.startTime);
  var travel = parseInt(item.travelMin, 10) || 0;
  var dur = parseInt(item.durationMin, 10) || 0;
  var depart = start - travel;
  var end = start + dur;
  return '<div class="plan-summary">🚗 Abfahrt ' + minutesToHHMM(depart) + " → 📍 vor Ort ab " + minutesToHHMM(start) + " → 🏁 zurück ab " + minutesToHHMM(end) + "</div>";
}

function renderUnternehmungenBoard() {
  var html = renderReiseSettings();
  var days = getDayList();
  var winStart = hhmmToMinutes(state.reise.dayStart);
  var winEnd = hhmmToMinutes(state.reise.dayEnd);
  var winLen = Math.max(1, winEnd - winStart);

  if (days.length > 2) html += '<div class="planner-hint">👉 Zur Seite wischen für weitere Tage – wie im Wochenplaner</div>';
  html += '<div class="planner-wrap"><div class="planner-grid">';

  days.forEach(function (d) {
    var dayItems = state.unternehmungen.filter(function (it) { return String(it.day) === String(d.index) && it.startTime; });
    dayItems.sort(function (a, b) { return (hhmmToMinutes(a.startTime) - (a.travelMin||0)) - (hhmmToMinutes(b.startTime) - (b.travelMin||0)); });

    var busyMinutes = 0;
    var segsHtml = "";
    var intervals = [];
    dayItems.forEach(function (it) {
      var start = hhmmToMinutes(it.startTime);
      var travel = parseInt(it.travelMin, 10) || 0;
      var dur = parseInt(it.durationMin, 10) || 0;
      var segStart = start - travel;
      var segEnd = start + dur;
      intervals.push([segStart, segEnd]);
      busyMinutes += travel + dur;
      var travelLeft = Math.max(0, ((segStart - winStart) / winLen) * 100);
      var travelWidth = Math.max(0, (travel / winLen) * 100);
      var onsiteLeft = Math.max(0, ((start - winStart) / winLen) * 100);
      var onsiteWidth = Math.max(0, (dur / winLen) * 100);
      segsHtml += '<div class="load-seg travel" style="left:' + travelLeft + '%;width:' + travelWidth + '%"></div>';
      segsHtml += '<div class="load-seg onsite" style="left:' + onsiteLeft + '%;width:' + onsiteWidth + '%"></div>';
    });

    var overlap = false;
    intervals.sort(function (a, b) { return a[0] - b[0]; });
    for (var i = 1; i < intervals.length; i++) if (intervals[i][0] < intervals[i - 1][1]) overlap = true;

    var pct = Math.min(100, Math.round((busyMinutes / winLen) * 100));
    var bandLabel = pct === 0 ? "frei ☁️" : pct < 40 ? "entspannt 😌" : pct < 75 ? "gut gefüllt 🙂" : "vollgepackt 🔥";

    html += '<div class="planner-col"><h3>Tag ' + (d.index + 1) + "<br>" + formatDayLabel(d.iso) + "</h3>" +
      '<div class="load-bar-bg">' + segsHtml + "</div>" +
      '<div class="load-label">' + pct + "% – " + bandLabel + (overlap ? ' <span class="warn-overlap">⚠️</span>' : "") + "</div>";

    if (dayItems.length === 0) {
      html += '<div class="planner-empty">Noch nichts hier.</div>';
    } else {
      dayItems.forEach(function (it) {
        var start = hhmmToMinutes(it.startTime);
        var travel = parseInt(it.travelMin, 10) || 0;
        var dur = parseInt(it.durationMin, 10) || 0;
        html += '<div class="day-item"><span class="time-badge">' + minutesToHHMM(start) + "–" + minutesToHHMM(start + dur) + "</span><div><div class=\"di-title\">" + escapeHtml(it.text) + "</div>" +
          (travel ? '<div class="di-note">inkl. ' + travel + " Min Fahrt</div>" : "") + "</div></div>";
      });
    }
    html += "</div>";
  });

  html += "</div></div>";

  var unscheduled = state.unternehmungen.filter(function (it) { return it.day === null || it.day === undefined || it.day === "" || !it.startTime; });
  if (unscheduled.length) {
    html += '<div class="day-card"><h3>💭 Noch nicht eingeplant</h3>' + unscheduled.map(function (it) {
      return '<div class="day-item"><div class="di-title">' + escapeHtml(it.text) + "</div></div>";
    }).join("") + "</div>";
  }

  contentEl.innerHTML = html;
}

/* ============================= EINKAUFSLISTE ============================= */

function normName(s) { return (s || "").trim().toLowerCase(); }

function computeDerivedIngredients() {
  var map = {};
  state.essen.entries.forEach(function (e) {
    if (e.type !== "kochen" || !e.dishId) return;
    var dish = dishFind(e.dishId);
    if (!dish) return;
    dish.ingredients.forEach(function (ing) {
      if (!ing.name || !ing.name.trim()) return;
      var key = normName(ing.name);
      if (!map[key]) map[key] = { name: ing.name.trim(), amounts: [], sources: [] };
      if (ing.amount) map[key].amounts.push(ing.amount);
      map[key].sources.push(dish.name);
    });
  });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name, "de"); });
}

function collectPacklisteToBuy() {
  var out = [];
  for (var cat in state.packliste) {
    state.packliste[cat].forEach(function (item) {
      if (item.wantToBuy && !item.done) out.push({ item: item, cat: cat });
    });
  }
  return out;
}

function renderEinkauf() {
  subTabsEl.innerHTML = "";
  var derived = computeDerivedIngredients();
  var toBuy = collectPacklisteToBuy();

  var html = '<h2 class="section-title">🛒 Einkaufsliste</h2>';

  html += '<h2 class="section-title" style="font-size:14px;color:var(--muted)">🎒 Aus der Packliste (noch fehlend & zum Einkaufen markiert)</h2>';
  if (toBuy.length === 0) {
    html += '<div class="hint">Noch nichts markiert. Tippe in der Packliste bei einem Punkt auf 🛒, damit er hier auftaucht.</div>';
  } else {
    var PERSON_TAGS = ["lissy", "marc", "sonstiges"];
    PERSON_TAGS.forEach(function (tagKey) {
      var info = packTagInfo(tagKey);
      var group = toBuy.filter(function (x) { return (x.item.tag === tagKey) || (tagKey === "sonstiges" && PERSON_TAGS.indexOf(x.item.tag) === -1); });
      if (group.length === 0) return;
      html += '<h2 class="section-title" style="font-size:12.5px;color:var(--pink-dark);margin-top:10px">' + info.emoji + " " + info.label + "</h2>";
      html += group.map(function (x) {
        var item = x.item;
        return '<div class="check-row">' +
          '<input type="checkbox" data-action="pack-buy-checkoff" data-id="' + item.id + '">' +
          '<div class="ck-text">' + escapeHtml(item.text) + (item.note ? '<div class="ck-source">📝 ' + escapeHtml(item.note) + "</div>" : "") +
          '<div class="ck-source">aus: ' + escapeHtml(x.cat) + "</div></div></div>";
      }).join("");
    });
  }

  html += '<h2 class="section-title" style="font-size:14px;color:var(--muted);margin-top:18px">Automatisch aus dem Essensplan</h2>';
  if (derived.length === 0) {
    html += '<div class="hint">Noch keine Gerichte im Essensplan eingeplant.</div>';
  } else {
    html += derived.map(function (ing) {
      var key = normName(ing.name);
      var bought = !!state.einkauf.bought[key];
      var uniqueSources = ing.sources.filter(function (v, i, a) { return a.indexOf(v) === i; });
      return '<div class="check-row' + (bought ? " bought" : "") + '">' +
        '<input type="checkbox" data-action="derived-toggle" data-key="' + escapeHtml(key) + '" ' + (bought ? "checked" : "") + '>' +
        '<div class="ck-text">' + escapeHtml(ing.name) + (ing.amounts.length ? " — " + escapeHtml(ing.amounts.join(" + ")) : "") +
        '<div class="ck-source">für: ' + escapeHtml(uniqueSources.join(", ")) + "</div></div></div>";
    }).join("");
  }

  html += '<h2 class="section-title" style="font-size:14px;color:var(--muted);margin-top:18px">Eigene Punkte</h2>';
  html += '<form class="add-form" data-action="custom-add"><input type="text" name="text" placeholder="Eigenen Punkt hinzufügen…" autocomplete="off"><button type="submit">+</button></form>';
  if (state.einkauf.custom.length === 0) {
    html += '<div class="hint">Noch keine eigenen Punkte.</div>';
  } else {
    html += state.einkauf.custom.map(function (item) {
      return '<div class="check-row' + (item.bought ? " bought" : "") + '">' +
        '<input type="checkbox" data-action="custom-toggle" data-id="' + item.id + '" ' + (item.bought ? "checked" : "") + '>' +
        '<div class="ck-text" data-action="custom-edit-text" data-id="' + item.id + '">' + escapeHtml(item.text) + "</div>" +
        '<button class="icon-btn" data-action="custom-delete" data-id="' + item.id + '">🗑️</button></div>';
    }).join("");
  }

  contentEl.innerHTML = html;
}

/* ============================= EVENT DELEGATION ============================= */

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-action]");
  if (!t) return;
  var action = t.getAttribute("data-action");

  switch (action) {
    case "main-tab":
      state.ui.mainTab = t.getAttribute("data-key");
      save(); renderApp(); break;

    /* packliste */
    case "pack-cat":
      state.ui.packlisteCat = t.getAttribute("data-cat");
      save(); renderApp(); break;
    case "pack-set-tag": {
      var item = packFindItem(t.getAttribute("data-id"));
      if (item) {
        var clickedTag = t.getAttribute("data-tag");
        item.tag = (item.tag === clickedTag) ? null : clickedTag;
        save(); renderApp();
      }
      break;
    }
    case "pack-toggle-buy": {
      var itemBuy = packFindItem(t.getAttribute("data-id"));
      if (itemBuy) {
        itemBuy.wantToBuy = !itemBuy.wantToBuy;
        save(); renderApp();
      }
      break;
    }
    case "pack-edit-text": {
      var item2 = packFindItem(t.getAttribute("data-id"));
      if (item2) {
        var next = window.prompt("Punkt bearbeiten:", item2.text);
        if (next !== null && next.trim() !== "") { item2.text = next.trim(); save(); renderApp(); }
      }
      break;
    }
    case "pack-edit-note": {
      var item3 = packFindItem(t.getAttribute("data-id"));
      if (item3) {
        var noteNext = window.prompt("Notiz zu \"" + item3.text + "\":", item3.note || "");
        if (noteNext !== null) { item3.note = noteNext.trim(); save(); renderApp(); }
      }
      break;
    }
    case "pack-delete": {
      var id = t.getAttribute("data-id");
      var item4 = packFindItem(id);
      if (item4 && window.confirm('"' + item4.text + '" wirklich löschen?')) {
        state.packliste[state.ui.packlisteCat] = state.packliste[state.ui.packlisteCat].filter(function (i) { return i.id !== id; });
        // fallback: search all categories in case current view differs
        for (var cat in state.packliste) state.packliste[cat] = state.packliste[cat].filter(function (i) { return i.id !== id; });
        save(); renderApp();
      }
      break;
    }
    case "pack-reset-cat": {
      var cat2 = t.getAttribute("data-cat");
      if (window.confirm('Reiter "' + cat2 + '" wirklich auf die Originalliste zurücksetzen?')) {
        state.packliste[cat2] = DEFAULT_PACKLISTE[cat2].map(function (text) { return { id: uid("p"), text: text, note: "", tag: null, done: false, wantToBuy: false }; });
        save(); renderApp();
      }
      break;
    }

    /* unternehmungen */
    case "u-view": state.ui.uView = t.getAttribute("data-view"); save(); renderApp(); break;
    case "u-cycle-status": {
      var uit = uFindItem(t.getAttribute("data-id"));
      if (uit) {
        var uidx = U_STATUSES.findIndex(function (s) { return s.key === uit.status; });
        uit.status = U_STATUSES[(uidx + 1) % U_STATUSES.length].key;
        save(); renderApp();
      }
      break;
    }
    case "u-edit-text": {
      var uit2 = uFindItem(t.getAttribute("data-id"));
      if (uit2) {
        var un = window.prompt("Bearbeiten:", uit2.text);
        if (un !== null && un.trim() !== "") { uit2.text = un.trim(); save(); renderApp(); }
      }
      break;
    }
    case "u-edit-note": {
      var uit3 = uFindItem(t.getAttribute("data-id"));
      if (uit3) {
        var unote = window.prompt("Notiz:", uit3.note || "");
        if (unote !== null) { uit3.note = unote.trim(); save(); renderApp(); }
      }
      break;
    }
    case "u-delete": {
      var uid2 = t.getAttribute("data-id");
      var uit4 = uFindItem(uid2);
      if (uit4 && window.confirm('"' + uit4.text + '" wirklich löschen?')) {
        state.unternehmungen = state.unternehmungen.filter(function (i) { return i.id !== uid2; });
        save(); renderApp();
      }
      break;
    }
    case "u-set-rating": {
      var uit5 = uFindItem(t.getAttribute("data-id"));
      if (uit5) { uit5.rating = parseInt(t.getAttribute("data-val"), 10); save(); renderApp(); }
      break;
    }
    case "u-remove-img": {
      var uit6 = uFindItem(t.getAttribute("data-id"));
      var role = t.getAttribute("data-role");
      if (uit6) {
        if (role === "planned") uit6.plannedImg = null; else uit6.diaryImg = null;
        save(); renderApp();
      }
      break;
    }

    /* essen: gerichte */
    case "dish-edit-name": {
      var dish = dishFind(t.getAttribute("data-id"));
      if (dish) {
        var dn = window.prompt("Name des Gerichts:", dish.name);
        if (dn !== null && dn.trim() !== "") { dish.name = dn.trim(); save(); renderApp(); }
      }
      break;
    }
    case "dish-delete": {
      var did = t.getAttribute("data-id");
      var dish2 = dishFind(did);
      if (dish2 && window.confirm('Gericht "' + dish2.name + '" wirklich löschen?')) {
        state.essen.dishes = state.essen.dishes.filter(function (d) { return d.id !== did; });
        state.essen.entries = state.essen.entries.filter(function (e) { return e.dishId !== did; });
        save(); renderApp();
      }
      break;
    }
    case "ing-add": {
      var dish3 = dishFind(t.getAttribute("data-dish"));
      if (dish3) { dish3.ingredients.push({ id: uid("ing"), name: "", amount: "" }); save(); renderApp(); }
      break;
    }
    case "ing-delete": {
      var dish4 = dishFind(t.getAttribute("data-dish"));
      var ingId = t.getAttribute("data-ing");
      if (dish4) { dish4.ingredients = dish4.ingredients.filter(function (i) { return i.id !== ingId; }); save(); renderApp(); }
      break;
    }

    /* essen: board */
    case "e-view": state.ui.eView = t.getAttribute("data-view"); save(); renderApp(); break;
    case "entry-delete": {
      var eid = t.getAttribute("data-id");
      state.essen.entries = state.essen.entries.filter(function (e) { return e.id !== eid; });
      save(); renderApp();
      break;
    }

    /* einkauf */
    case "custom-edit-text": {
      var citem = state.einkauf.custom.find(function (i) { return i.id === t.getAttribute("data-id"); });
      if (citem) {
        var cn = window.prompt("Bearbeiten:", citem.text);
        if (cn !== null && cn.trim() !== "") { citem.text = cn.trim(); save(); renderApp(); }
      }
      break;
    }
    case "custom-delete": {
      var cid = t.getAttribute("data-id");
      state.einkauf.custom = state.einkauf.custom.filter(function (i) { return i.id !== cid; });
      save(); renderApp();
      break;
    }
  }
});

document.addEventListener("change", function (e) {
  var t = e.target;
  var action = t.getAttribute && t.getAttribute("data-action");
  if (!action) return;

  if (action === "reise-field") {
    var field = t.getAttribute("data-field");
    state.reise[field] = field === "days" ? (parseInt(t.value, 10) || 1) : t.value;
    save(); renderApp();
    return;
  }

  if (action === "pack-toggle-done") {
    var pitem = packFindItem(t.getAttribute("data-id"));
    if (pitem) { pitem.done = t.checked; save(); renderApp(); }
    return;
  }

  if (action === "u-field") {
    var uitem = uFindItem(t.getAttribute("data-id"));
    if (uitem) {
      var f = t.getAttribute("data-field");
      var v = t.value;
      if (f === "day") uitem.day = v === "" ? null : parseInt(v, 10);
      else if (f === "travelMin" || f === "durationMin") uitem[f] = parseInt(v, 10) || 0;
      else uitem[f] = v;
      save(); renderApp();
    }
    return;
  }

  if (action === "u-img-input") {
    var id = t.getAttribute("data-id");
    var role = t.getAttribute("data-role");
    var file = t.files && t.files[0];
    if (!file) return;
    compressImageFile(file, 900, 0.65).then(function (dataUrl) {
      var uitem2 = uFindItem(id);
      if (!uitem2) return;
      if (role === "planned") uitem2.plannedImg = dataUrl; else uitem2.diaryImg = dataUrl;
      save(); renderApp();
    }).catch(function () {
      alert("Foto konnte nicht geladen werden.");
    });
    return;
  }

  if (action === "ing-field") {
    var dish = dishFind(t.getAttribute("data-dish"));
    if (dish) {
      var ing = dish.ingredients.find(function (i) { return i.id === t.getAttribute("data-ing"); });
      if (ing) { ing[t.getAttribute("data-field")] = t.value; save(); }
    }
    return;
  }

  if (action === "pack-buy-checkoff") {
    var boughtItem = packFindItem(t.getAttribute("data-id"));
    if (boughtItem && t.checked) {
      boughtItem.tag = "vorhanden";
      boughtItem.wantToBuy = false;
      save(); renderApp();
    }
    return;
  }

  if (action === "derived-toggle") {
    var key = t.getAttribute("data-key");
    state.einkauf.bought[key] = t.checked;
    save(); renderApp();
    return;
  }

  if (action === "custom-toggle") {
    var citem2 = state.einkauf.custom.find(function (i) { return i.id === t.getAttribute("data-id"); });
    if (citem2) { citem2.bought = t.checked; save(); renderApp(); }
    return;
  }
});

document.addEventListener("submit", function (e) {
  var form = e.target.closest("form[data-action]");
  if (!form) return;
  e.preventDefault();
  var action = form.getAttribute("data-action");

  if (action === "pack-add") {
    var text = form.text.value.trim();
    if (!text) return;
    var cat = form.getAttribute("data-cat");
    state.packliste[cat].push({ id: uid("p"), text: text, note: "", tag: null, done: false, wantToBuy: false });
    save(); renderApp();
    return;
  }

  if (action === "u-add") {
    var utext = form.text.value.trim();
    if (!utext) return;
    state.unternehmungen.push({ id: uid("u"), text: utext, note: "", status: "idee", rating: 0, plannedImg: null, diaryImg: null, day: null, startTime: "", travelMin: 0, durationMin: 60 });
    save(); renderApp();
    return;
  }

  if (action === "dish-add") {
    var dtext = form.text.value.trim();
    if (!dtext) return;
    state.essen.dishes.push({ id: uid("dish"), name: dtext, ingredients: [] });
    save(); renderApp();
    return;
  }

  if (action === "entry-add") {
    var day = parseInt(form.getAttribute("data-day"), 10);
    var type = form.type.value;
    var note = form.note.value.trim();
    if (type === "kochen") {
      var dishId = form.dishId.value;
      if (!dishId) { alert("Bitte ein Gericht auswählen."); return; }
      state.essen.entries.push({ id: uid("entry"), day: day, type: "kochen", dishId: dishId, restaurant: "", note: note });
    } else {
      var rest = form.restaurant.value.trim();
      if (!rest) { alert("Bitte einen Restaurantnamen eingeben."); return; }
      state.essen.entries.push({ id: uid("entry"), day: day, type: "restaurant", dishId: null, restaurant: rest, note: note });
    }
    save(); renderApp();
    return;
  }

  if (action === "custom-add") {
    var ctext = form.text.value.trim();
    if (!ctext) return;
    state.einkauf.custom.push({ id: uid("c"), text: ctext, note: "", bought: false });
    save(); renderApp();
    return;
  }
});

/* ============================= BACKUP / RESET ============================= */

document.getElementById("export-btn").addEventListener("click", function () {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = "cotedazur-backup-" + today + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
});

document.getElementById("import-trigger-btn").addEventListener("click", function () {
  document.getElementById("import-file-input").click();
});

document.getElementById("import-file-input").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!window.confirm("Backup wirklich einspielen? Der aktuelle Stand auf diesem Gerät wird überschrieben.")) { e.target.value = ""; return; }
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(reader.result);
      state = parsed;
      save();
      renderApp();
      alert("Backup erfolgreich eingespielt! ✨");
    } catch (err) {
      alert("Diese Datei konnte nicht gelesen werden.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

document.getElementById("reset-all-btn").addEventListener("click", function () {
  if (!window.confirm("Wirklich die KOMPLETTE App (Packliste, Unternehmungen, Essensplan, Einkaufsliste) auf den Originalzustand zurücksetzen? Alle eigenen Änderungen, Fotos und Planungen gehen verloren.")) return;
  state = freshState();
  save();
  renderApp();
});

/* ============================= INIT ============================= */

renderApp();

})();
</script>
